version: '3'
services:
  web:
    build: .
    ports:
      - "8089:80"
    volumes:
      - ./app:/usr/share/nginx/html
    environment:
      - PYTHONUNBUFFERED=1
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - TENANT_ID=${TENANT_ID}
      - SITE_ID=${SITE_ID}
      - DRIVE_ID=${DRIVE_ID}
      - ITEM_ID=${ITEM_ID}
      - IMAGE_FOLDER_ID=${IMAGE_FOLDER_ID}
      - GEBKIS_DIR=${GEBKIS_DIR}
      - GEBKIS_IMG_DIR=${GEBKIS_IMG_DIR}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: always
