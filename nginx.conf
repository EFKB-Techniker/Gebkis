events {
    worker_connections 1024;
}

http {
    # Container Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    include mime.types;
    default_type application/octet-stream;

    # Port aus Umgebungsvariable oder Standard 80
    map $http_host $external_port {
        "~^[^:]+:(?<p>\d+)$"  $p;
        default               "80";
    }

    server {
        listen 80;  # Zurück zu Port 80 für Container-interne Kommunikation
        server_name localhost;
        root /usr/share/nginx/html/gebkis-frontend;
        index index.html;

        # Redirect root to aktuelle_woche_s1.html with explicit port 6001
        location = / {
            return 301 $scheme://$host:$external_port/aktuelle_woche_s1.html;
        }

        # Handle week/page URLs
        location ~ ^/(aktuelle|vorherige)_woche_s\d+\.html$ {
            try_files /index.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        location ^~ /excel/ {
            alias /usr/share/nginx/html/gebkis-data/excel/;
            autoindex on;
            autoindex_format json;
            add_header Cache-Control no-cache;
            expires 0;
        }

        location ^~ /images/ {
            alias /usr/share/nginx/html/gebkis-data/images/;
            access_log off;
            add_header Cache-Control no-cache;
            expires 0;
        }

        location ~* \.(html|htm)$ {
            add_header Cache-Control "no-cache";
            expires 0;
            access_log off;
        }

        location ~* ^.+\.(jpg|jpeg|gif|png|ico|css|zip|tgz|gz|rar|bz2|pdf|txt|tar|wav|bmp|rtf|js|flv|swf|xml)$ {
            # clear all access_log directives for the current level
            access_log off;
            add_header Cache-Control "no-cache";
            expires 0;
        }
    }
}
